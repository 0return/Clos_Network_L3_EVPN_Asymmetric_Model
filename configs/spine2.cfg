# =========================
# NETWORK INSTANCE DEFAULT
# =========================

set /network-instance default type default
set /network-instance default admin-state enable

set /network-instance default interface ethernet-1/1.0
set /network-instance default interface ethernet-1/2.0
set /network-instance default interface ethernet-1/3.0
set /network-instance default interface system0.0


# =========================
# NETWORK INSTANCE MGMT
# =========================

set /network-instance mgmt type ip-vrf
set /network-instance mgmt admin-state enable
set /network-instance mgmt description "Management network instance"

set /network-instance mgmt interface mgmt0.0

set /network-instance mgmt protocols linux import-routes true
set /network-instance mgmt protocols linux export-routes true
set /network-instance mgmt protocols linux export-neighbors true


# =========================
# ROUTING POLICY
# =========================

set /routing-policy prefix-set peers prefix 100.0.0.0/16 mask-length-range 32..32

set /routing-policy policy export-peers default-action policy-result reject
set /routing-policy policy export-peers statement 10 match prefix prefix-set peers
set /routing-policy policy export-peers statement 10 action policy-result accept

set /routing-policy policy import-peers default-action policy-result reject
set /routing-policy policy import-peers statement 10 match prefix prefix-set peers
set /routing-policy policy import-peers statement 10 action policy-result accept


# =========================
# INTERFACE ETHERNET-1/1
# =========================

set /interface ethernet-1/1 admin-state enable
set /interface ethernet-1/1 subinterface 0 admin-state enable
set /interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set /interface ethernet-1/1 subinterface 0 ipv4 address 10.2.1.1/30


# =========================
# INTERFACE ETHERNET-1/2
# =========================

set /interface ethernet-1/2 admin-state enable
set /interface ethernet-1/2 subinterface 0 admin-state enable
set /interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set /interface ethernet-1/2 subinterface 0 ipv4 address 10.2.2.1/30


# =========================
# INTERFACE ETHERNET-1/3
# =========================

set /interface ethernet-1/3 admin-state enable
set /interface ethernet-1/3 subinterface 0 admin-state enable
set /interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set /interface ethernet-1/3 subinterface 0 ipv4 address 10.2.3.1/30


# =========================
# INTERFACE MGMT0
# =========================

set /interface mgmt0 admin-state enable
set /interface mgmt0 subinterface 0 admin-state enable

set /interface mgmt0 subinterface 0 ipv4 admin-state enable
set /interface mgmt0 subinterface 0 ipv4 dhcp-client

set /interface mgmt0 subinterface 0 ipv6 admin-state enable
set /interface mgmt0 subinterface 0 ipv6 dhcp-client


# =========================
# INTERFACE SYSTEM0
# =========================

set /interface system0 admin-state enable
set /interface system0 subinterface 0 admin-state enable

set /interface system0 subinterface 0 ipv4 admin-state enable
set /interface system0 subinterface 0 ipv4 address 100.0.1.2/32


# =========================
# BGP
# =========================

set /network-instance default protocols bgp admin-state enable
set /network-instance default protocols bgp autonomous-system 64999
set /network-instance default protocols bgp router-id 100.0.1.2

set /network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable


# =========================
# BGP GROUP EVPN RR
# =========================

set /network-instance default protocols bgp group evpnRR admin-state enable
set /network-instance default protocols bgp group evpnRR peer-as 65000

set /network-instance default protocols bgp group evpnRR afi-safi evpn admin-state enable
set /network-instance default protocols bgp group evpnRR afi-safi ipv4-unicast admin-state disable

set /network-instance default protocols bgp group evpnRR local-as as-number 65000

set /network-instance default protocols bgp group evpnRR route-reflector client true
set /network-instance default protocols bgp group evpnRR route-reflector cluster-id 100.0.1.2


# =========================
# BGP GROUP LEAFS
# =========================

set /network-instance default protocols bgp group leafs export-policy export-peers
set /network-instance default protocols bgp group leafs import-policy import-peers


# =========================
# BGP NEIGHBORS - LEAFS
# =========================

set /network-instance default protocols bgp neighbor 10.2.1.2 peer-as 65001
set /network-instance default protocols bgp neighbor 10.2.1.2 peer-group leafs

set /network-instance default protocols bgp neighbor 10.2.2.2 peer-as 65002
set /network-instance default protocols bgp neighbor 10.2.2.2 peer-group leafs

set /network-instance default protocols bgp neighbor 10.2.3.2 peer-as 65003
set /network-instance default protocols bgp neighbor 10.2.3.2 peer-group leafs


# =========================
# BGP NEIGHBORS - EVPN RR
# =========================

set /network-instance default protocols bgp neighbor 100.0.2.1 peer-group evpnRR
set /network-instance default protocols bgp neighbor 100.0.2.2 peer-group evpnRR
set /network-instance default protocols bgp neighbor 100.0.2.3 peer-group evpnRR
